<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- NomNom Games — the mark. A full moon (centre 50,50, radius 40) with a bite taken out of its
       upper right: three scallops of radius 7 where the teeth went. NomNom, at night. This is the
       same geometry the Lantern Watch title sequence draws (games/lantern-watch/src/components/Intro.tsx).
       Full-colour version, for dark grounds. -->
  <defs>
    <radialGradient id="moon" cx="38%" cy="40%" r="68%">
      <stop offset="0" stop-color="#fff6e2"/>
      <stop offset="0.55" stop-color="#ecd6ad"/>
      <stop offset="1" stop-color="#b48652"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0  0 0.85 0 0 0  0 0 0.6 0 0  0 0 0 0.35 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path id="bitten-moon" d="M 87.59 36.32 A 40 40 0 1 1 63.68 12.41 A 7 7 0 0 0 71.65 20.38 A 7 7 0 0 0 79.62 28.35 A 7 7 0 0 0 87.59 36.32 Z" fill="url(#moon)"/>
    <g fill="#7a5228" fill-opacity="0.22">
      <circle cx="36" cy="58" r="6.5"/>
      <circle cx="57" cy="71" r="3.8"/>
      <circle cx="31" cy="37" r="3.2"/>
      <circle cx="60" cy="49" r="2.4"/>
    </g>
    <path d="M 87.59 36.32 A 40 40 0 1 1 63.68 12.41 A 7 7 0 0 0 71.65 20.38 A 7 7 0 0 0 79.62 28.35 A 7 7 0 0 0 87.59 36.32 Z" fill="none" stroke="#f8e2b6" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
